<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin | Personalizadas Brasil</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap');
  :root{ --gold:#f5b400; --gold-2:#ffd668; }
  body{ background:#0a0a0a; color:#f4f1ea; font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Archivo Black','Inter',sans-serif; }
  .gold-text{ background: linear-gradient(180deg, var(--gold-2), var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .gold-grad{ background: linear-gradient(180deg, var(--gold-2), var(--gold)); }
  .card{ background:#141310; border:1px solid #2a2620; border-radius:16px; }
  input, textarea, select{
    background:#0f0e0c; border:1px solid #33301f; color:#f4f1ea; border-radius:10px; padding:10px 12px; width:100%; font-size:13.5px;
  }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--gold); }
  label{ font-size:11.5px; color:#9a968c; font-weight:600; display:block; margin-bottom:4px; }
  .btn{ background:var(--gold); color:#151100; font-weight:800; border-radius:10px; padding:9px 16px; font-size:13px; }
  .btn-danger{ background:#3a1414; color:#ff8a8a; border:1px solid #5c1f1f; }
  .btn-outline{ background:transparent; border:1px solid #33301f; color:#f4f1ea; }
  .tab-btn{ padding:9px 14px; border-radius:10px; font-size:12.5px; font-weight:700; color:#9a968c; }
  .tab-btn.active{ background:var(--gold); color:#151100; }
  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background:#33301f; border-radius:4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react,env">
const { useState, useEffect, useRef } = React;

/* >>> Cole AQUI a MESMA configuração do Firebase usada no index.html <<< */
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI.firebaseapp.com",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};

let db=null, storage=null, ready=false;
try{
  if(firebaseConfig.apiKey!=="COLE_AQUI"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    storage = firebase.storage();
    ready = true;
  }
}catch(e){ console.warn(e); }

async function sha256(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- Upload de imagem/vídeo ---------- */
function UploadField({label, value, onChange, accept="image/*", folder="uploads"}){
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef();
  const handleFile = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    if(!ready){ alert("Configure o Firebase primeiro (veja o topo do arquivo admin.html)."); return; }
    setUploading(true);
    try{
      const ref = storage.ref().child(`${folder}/${uid()}_${file.name}`);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      onChange(url);
    }catch(err){ alert("Erro no upload: "+err.message); }
    setUploading(false);
  };
  return (
    <div>
      <label>{label}</label>
      <div className="flex gap-2 items-center">
        <input value={value||""} onChange={e=>onChange(e.target.value)} placeholder="URL ou envie um arquivo" className="flex-1"/>
        <button type="button" onClick={()=>inputRef.current.click()} className="btn-outline text-[11px] px-3 py-2 whitespace-nowrap">
          {uploading? "Enviando..." : "Enviar"}
        </button>
        <input ref={inputRef} type="file" accept={accept} onChange={handleFile} className="hidden"/>
      </div>
      {value && (accept.includes("video")
        ? <video src={value} className="w-full h-32 object-cover rounded-lg mt-2" controls/>
        : <img src={value} className="w-full h-32 object-cover rounded-lg mt-2"/>)}
    </div>
  );
}

/* ---------- Login ---------- */
function Login({onOk}){
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    setBusy(true); setErr("");
    try{
      if(!ready){ setErr("Configure o Firebase no topo do arquivo admin.html primeiro."); setBusy(false); return; }
      const doc = await db.doc("config/admin").get();
      let hash = doc.exists ? doc.data().pinHash : null;
      if(!hash){
        // primeiro acesso: define o PIN digitado como novo PIN
        hash = await sha256(pin);
        await db.doc("config/admin").set({pinHash:hash}, {merge:true});
        onOk(); return;
      }
      const h = await sha256(pin);
      if(h===hash) onOk(); else setErr("PIN incorreto.");
    }catch(e){ setErr("Erro: "+e.message); }
    setBusy(false);
  };
  return (
    <div className="min-h-screen flex items-center justify-center px-6">
      <div className="card p-8 w-full max-w-sm text-center">
        <div className="w-14 h-14 gold-grad rounded-2xl flex items-center justify-center mx-auto mb-4">
          <img src="https://api.iconify.design/mdi/lock-outline.svg?color=%23151100" style={{width:26,height:26}}/>
        </div>
        <h1 className="font-display text-lg mb-1">PAINEL <span className="gold-text">ADMIN</span></h1>
        <p className="text-[12px] text-white/40 mb-6">Personalizadas Brasil</p>
        <input type="password" inputMode="numeric" placeholder="Digite o PIN" value={pin} onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&submit()} className="text-center text-lg tracking-[0.3em] mb-3"/>
        {err && <p className="text-red-400 text-[11.5px] mb-3">{err}</p>}
        <button onClick={submit} disabled={busy} className="btn w-full">{busy?"Verificando...":"Entrar"}</button>
        <p className="text-[10.5px] text-white/30 mt-4">Primeiro acesso? O PIN digitado agora será salvo como seu PIN.</p>
      </div>
    </div>
  );
}

/* ---------- Layout ---------- */
function Shell({children, active, setActive}){
  const tabs = [
    ["config","Início"], ["products","Produtos"], ["works","Trabalhos"],
    ["clients","Clientes"], ["videos","Vídeos"], ["promo","Promoção"],
  ];
  return (
    <div className="min-h-screen pb-16">
      <div className="sticky top-0 z-20 bg-black/90 backdrop-blur border-b border-white/10 px-4 py-3">
        <div className="flex items-center justify-between mb-3">
          <h1 className="font-display text-sm">PAINEL <span className="gold-text">ADMIN</span></h1>
          <a href="index.html" target="_blank" className="text-[11px] btn-outline px-3 py-1.5">Ver site ↗</a>
        </div>
        <div className="flex gap-2 overflow-x-auto pb-1">
          {tabs.map(([id,label])=>(
            <button key={id} onClick={()=>setActive(id)} className={`tab-btn whitespace-nowrap ${active===id?'active':''}`}>{label}</button>
          ))}
        </div>
      </div>
      <div className="max-w-2xl mx-auto p-4">{children}</div>
    </div>
  );
}

function SaveBar({onSave, saved}){
  return (
    <div className="flex items-center gap-3 mt-4">
      <button onClick={onSave} className="btn">Salvar alterações</button>
      {saved && <span className="text-green-400 text-[12px]">✓ Salvo</span>}
    </div>
  );
}

/* ---------- Config (Início / Contato) ---------- */
function ConfigTab(){
  const [cfg, setCfg] = useState(null);
  const [saved, setSaved] = useState(false);
  useEffect(()=>{ if(ready) db.doc("config/site").get().then(d=>setCfg(d.exists?d.data():{
    tagline:"Transformamos suas ideias em marcas que se destacam.",
    heroImageUrl:"", logoUrl:"", whatsapp:"(11) 98329-6441", instagram:"@personalizadasbrasil",
    email:"contato@personalizadasbrasil.com.br", address:"São Paulo - SP", hours:"Seg a Sáb · 9h às 19h"
  })); },[]);
  if(!cfg) return <p className="text-white/40 text-sm">Carregando...</p>;
  const set = (k,v)=>setCfg({...cfg,[k]:v});
  const save = async ()=>{ await db.doc("config/site").set(cfg,{merge:true}); setSaved(true); setTimeout(()=>setSaved(false),2000); };
  return (
    <div className="card p-5 space-y-4">
      <h2 className="font-display text-sm gold-text">DADOS GERAIS</h2>
      <div><label>Frase de efeito (tagline)</label><textarea rows="2" value={cfg.tagline} onChange={e=>set('tagline',e.target.value)}/></div>
      <UploadField label="Logo" value={cfg.logoUrl} onChange={v=>set('logoUrl',v)} folder="logo"/>
      <UploadField label="Imagem principal (hero)" value={cfg.heroImageUrl} onChange={v=>set('heroImageUrl',v)} folder="hero"/>
      <h2 className="font-display text-sm gold-text pt-2">CONTATO</h2>
      <div><label>WhatsApp (com DDD)</label><input value={cfg.whatsapp} onChange={e=>set('whatsapp',e.target.value)}/></div>
      <div><label>Instagram</label><input value={cfg.instagram} onChange={e=>set('instagram',e.target.value)}/></div>
      <div><label>E-mail</label><input value={cfg.email} onChange={e=>set('email',e.target.value)}/></div>
      <div><label>Endereço / Região</label><input value={cfg.address} onChange={e=>set('address',e.target.value)}/></div>
      <div><label>Horário de atendimento</label><input value={cfg.hours} onChange={e=>set('hours',e.target.value)}/></div>
      <SaveBar onSave={save} saved={saved}/>
    </div>
  );
}

/* ---------- Lista genérica (Produtos / Trabalhos / Clientes / Vídeos) ---------- */
function ListEditor({collection, fields, emptyItem, title, mediaFolder}){
  const [items, setItems] = useState([]);
  useEffect(()=>{
    if(!ready) return;
    const unsub = db.collection(collection).onSnapshot(snap=>{
      setItems(snap.docs.map(d=>({id:d.id, ...d.data()})));
    });
    return unsub;
  },[]);
  const addItem = async ()=>{
    await db.collection(collection).add({...emptyItem, order: items.length});
  };
  const updateItem = (id,k,v)=>{
    setItems(items.map(it=>it.id===id?{...it,[k]:v}:it));
  };
  const saveItem = async (item)=>{
    const {id, ...rest} = item;
    await db.collection(collection).doc(id).set(rest,{merge:true});
  };
  const deleteItem = async (id)=>{
    if(confirm("Excluir este item?")) await db.collection(collection).doc(id).delete();
  };
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-sm gold-text">{title} ({items.length})</h2>
        <button onClick={addItem} className="btn text-[12px]">+ Adicionar</button>
      </div>
      {items.length===0 && <p className="text-white/40 text-sm">Nenhum item ainda. Clique em "+ Adicionar".</p>}
      {items.map(item=>(
        <div key={item.id} className="card p-4 space-y-3">
          {fields.map(f=>(
            f.type==="media"
              ? <UploadField key={f.key} label={f.label} value={item[f.key]} onChange={v=>updateItem(item.id,f.key,v)} accept={f.accept||"image/*"} folder={mediaFolder}/>
              : f.type==="textarea"
              ? <div key={f.key}><label>{f.label}</label><textarea rows="2" value={item[f.key]||""} onChange={e=>updateItem(item.id,f.key,e.target.value)}/></div>
              : f.type==="select"
              ? <div key={f.key}><label>{f.label}</label>
                  <select value={item[f.key]||""} onChange={e=>updateItem(item.id,f.key,e.target.value)}>
                    <option value="">-</option>
                    {f.options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                  </select>
                </div>
              : <div key={f.key}><label>{f.label}</label><input value={item[f.key]||""} onChange={e=>updateItem(item.id,f.key,e.target.value)}/></div>
          ))}
          <div className="flex gap-2 pt-1">
            <button onClick={()=>saveItem(item)} className="btn text-[12px]">Salvar</button>
            <button onClick={()=>deleteItem(item.id)} className="btn-danger text-[12px] rounded-lg px-4">Excluir</button>
          </div>
        </div>
      ))}
    </div>
  );
}

const CAT_OPTIONS = [
  {value:"camisetas", label:"Camisetas"},
  {value:"sacolas", label:"Sacolas"},
  {value:"faixas", label:"Faixas"},
  {value:"xicaras", label:"Xícaras"},
];

function ProductsTab(){
  return <ListEditor collection="products" title="Produtos" mediaFolder="products"
    emptyItem={{name:"Novo produto", desc:"", imageUrl:""}}
    fields={[
      {key:"name", label:"Nome do produto"},
      {key:"desc", label:"Descrição curta", type:"textarea"},
      {key:"imageUrl", label:"Foto", type:"media"},
    ]}/>;
}
function WorksTab(){
  return <ListEditor collection="works" title="Trabalhos Realizados" mediaFolder="works"
    emptyItem={{clientName:"", productName:"", category:"camisetas", description:"", imageUrl:""}}
    fields={[
      {key:"clientName", label:"Nome do cliente"},
      {key:"productName", label:"Produto realizado"},
      {key:"category", label:"Categoria", type:"select", options:CAT_OPTIONS},
      {key:"description", label:"Descrição", type:"textarea"},
      {key:"imageUrl", label:"Foto principal", type:"media"},
    ]}/>;
}
function ClientsTab(){
  return <ListEditor collection="clients" title="Nossos Clientes" mediaFolder="clients"
    emptyItem={{companyName:"", product:"", category:"camisetas", testimonial:"", photoUrl:"", videoUrl:""}}
    fields={[
      {key:"companyName", label:"Nome da empresa"},
      {key:"product", label:"Produto feito"},
      {key:"category", label:"Categoria", type:"select", options:CAT_OPTIONS},
      {key:"testimonial", label:"Depoimento", type:"textarea"},
      {key:"photoUrl", label:"Foto", type:"media"},
      {key:"videoUrl", label:"Vídeo (opcional)", type:"media", accept:"video/*"},
    ]}/>;
}
function VideosTab(){
  return <ListEditor collection="videos" title="Vídeos" mediaFolder="videos"
    emptyItem={{title:"", url:""}}
    fields={[
      {key:"title", label:"Título do vídeo"},
      {key:"url", label:"Vídeo", type:"media", accept:"video/*"},
    ]}/>;
}

/* ---------- Promoção (documento único) ---------- */
function PromoTab(){
  const [promo, setPromo] = useState(null);
  const [saved, setSaved] = useState(false);
  useEffect(()=>{ if(ready) db.doc("config/promotion").get().then(d=>setPromo(d.exists?d.data():{
    title:"", description:"", price:"", deadline:"", imageUrl:"", active:true
  })); },[]);
  if(!promo) return <p className="text-white/40 text-sm">Carregando...</p>;
  const set=(k,v)=>setPromo({...promo,[k]:v});
  const save = async ()=>{ await db.doc("config/promotion").set(promo,{merge:true}); setSaved(true); setTimeout(()=>setSaved(false),2000); };
  return (
    <div className="card p-5 space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-display text-sm gold-text">🔥 PROMOÇÃO DO MÊS</h2>
        <label className="flex items-center gap-2 text-[12px] text-white/60">
          <input type="checkbox" checked={promo.active!==false} onChange={e=>set('active',e.target.checked)} className="w-auto"/> Ativa no app
        </label>
      </div>
      <div><label>Título</label><input value={promo.title} onChange={e=>set('title',e.target.value)}/></div>
      <div><label>Descrição</label><textarea rows="3" value={promo.description} onChange={e=>set('description',e.target.value)}/></div>
      <div className="grid grid-cols-2 gap-3">
        <div><label>Valor</label><input value={promo.price} onChange={e=>set('price',e.target.value)} placeholder="Ex: A partir de R$ 29,90"/></div>
        <div><label>Válido até</label><input value={promo.deadline} onChange={e=>set('deadline',e.target.value)} placeholder="Ex: 30/09"/></div>
      </div>
      <UploadField label="Imagem da promoção" value={promo.imageUrl} onChange={v=>set('imageUrl',v)} folder="promo"/>
      <SaveBar onSave={save} saved={saved}/>
    </div>
  );
}

/* ---------- App ---------- */
function App(){
  const [authed, setAuthed] = useState(false);
  const [active, setActive] = useState("config");
  if(!authed) return <Login onOk={()=>setAuthed(true)}/>;
  return (
    <Shell active={active} setActive={setActive}>
      {active==="config" && <ConfigTab/>}
      {active==="products" && <ProductsTab/>}
      {active==="works" && <WorksTab/>}
      {active==="clients" && <ClientsTab/>}
      {active==="videos" && <VideosTab/>}
      {active==="promo" && <PromoTab/>}
      {!ready && <p className="text-red-400 text-[12px] mt-6">⚠ Configure o Firebase no topo do arquivo admin.html para o painel funcionar.</p>}
    </Shell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
